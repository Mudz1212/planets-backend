services:
  planets-mvc:
    image: mudz1212/planets-mvc-cloud:latest
    build:
      context: ./server
    ports:
      - "80:80"
    restart: always
    depends_on:
      - planets-db
    networks:
      - planets-network

  planets-db:
    image: mudz1212/planets-db-cloud:latest
    build:
      context: ./db
    ports:
      - "5432:5432"
    restart: always
    networks:
      - planets-network

networks:
  planets-network:
